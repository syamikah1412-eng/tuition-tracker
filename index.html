<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4472C4">
<title>Tuition Content Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --header-blue:#4472C4;
  --header-blue-dark:#2f5597;
  --fill-green:#C6E0B4;
  --empty-grey:#F2F2F2;
  --status-red:#C00000;
  --status-green:#375623;
  --status-inprogress:#4472C4;
  --bg:#FFFFFF;
  --bg2:#F7F8FA;
  --border:#D9D9D9;
  --text:#1F1F1F;
  --muted:#6B6B6B;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg2);color:var(--text);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;}
body{padding-bottom:calc(24px + var(--safe-bottom));}

.topbar{background:var(--header-blue);color:#fff;padding:16px;position:sticky;top:0;z-index:10;
  box-shadow:0 1px 4px rgba(0,0,0,.15);}
.topbar-inner{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;}
.topbar h1{font-size:18px;font-weight:700;}
.topbar-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.student-select{background:#fff;color:var(--text);border:none;border-radius:6px;padding:8px 10px;
  font-size:14px;font-family:var(--font);cursor:pointer;}
.refreshed{font-size:12px;color:#e3e9f7;}

.auth-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);
  border-radius:6px;padding:8px 10px;font-size:13px;font-family:var(--font);cursor:pointer;
  display:flex;align-items:center;gap:6px;}
.auth-btn.unlocked{background:#375623;border-color:#375623;}

.auth-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;
  align-items:center;justify-content:center;z-index:100;padding:16px;}
.auth-modal-backdrop.open{display:flex;}
.auth-modal{background:var(--bg);border-radius:10px;padding:20px;max-width:320px;width:100%;}
.auth-modal h2{font-size:15px;margin-bottom:12px;}
.auth-modal input{width:100%;padding:10px;font-size:14px;border:1px solid var(--border);
  border-radius:6px;margin-bottom:10px;font-family:var(--font);}
.auth-modal-actions{display:flex;gap:8px;justify-content:flex-end;}
.auth-modal-actions button{padding:8px 14px;font-size:14px;border-radius:6px;border:none;
  cursor:pointer;font-family:var(--font);}
.auth-btn-cancel{background:var(--empty-grey);color:var(--text);}
.auth-btn-submit{background:var(--header-blue);color:#fff;}
.auth-btn-submit:disabled{opacity:.6;cursor:default;}
.auth-error{color:var(--status-red);font-size:12px;min-height:16px;margin-bottom:6px;}

.container{max-width:960px;margin:0 auto;padding:16px;}

.card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.card h2{font-size:15px;font-weight:700;color:var(--header-blue-dark);margin-bottom:10px;}

.state-message{padding:24px;text-align:center;color:var(--muted);}
.state-message.error{color:var(--status-red);}

.overall-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:600px){.overall-grid{grid-template-columns:1fr;}}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:4px;}
.stat-value{font-size:22px;font-weight:700;margin-bottom:8px;}

.bar-track{background:var(--empty-grey);border-radius:6px;height:14px;overflow:hidden;}
.bar-fill{background:var(--fill-green);height:100%;border-radius:6px 0 0 6px;transition:width .3s ease;}
.bar-fill.full{border-radius:6px;}
.bar-na{font-size:13px;color:var(--muted);padding:2px 0;}

.chapters-list{display:flex;flex-direction:column;gap:10px;}

.chapter-card{padding:0;overflow:hidden;}
.chapter-header{padding:14px 16px;cursor:pointer;}
.chapter-header-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.chapter-toggle-icon{font-size:11px;color:var(--muted);width:10px;flex-shrink:0;}
.chapter-card .chapter-title{font-size:14px;font-weight:700;color:var(--header-blue-dark);}
.chapter-card .chapter-meta{font-size:12px;color:var(--muted);margin-bottom:10px;}
.chapter-card .bar-row{margin-bottom:10px;}
.chapter-card .bar-row-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px;}

.chapter-body{padding:4px 16px 16px;border-top:1px solid var(--border);}
.chapter-body[hidden]{display:none;}
.chapter-worksheets{margin-bottom:10px;}

.subconcepts{display:flex;flex-direction:column;gap:8px;}
.subrow{border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  display:grid;grid-template-columns:1.4fr auto auto;gap:8px 14px;align-items:center;}
@media (max-width:600px){.subrow{grid-template-columns:1fr;}}
.subrow-main .subrow-name{font-size:14px;font-weight:600;}
.subrow-main .subrow-notes{font-size:12px;color:var(--muted);margin-top:4px;}
.subrow-main .subrow-date{font-size:12px;color:var(--muted);margin-top:2px;}
.subrow-worksheets{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;}
.worksheet-link{font-size:12px;color:var(--header-blue-dark);text-decoration:none;
  background:#E4ECF9;border-radius:6px;padding:3px 8px;white-space:nowrap;}
.worksheet-link:hover{text-decoration:underline;}

.units{display:flex;gap:4px;}
.unit-block{width:20px;height:20px;border-radius:4px;background:var(--empty-grey);border:1px solid var(--border);}
.unit-block.filled{background:var(--fill-green);border-color:#9fc37f;}

.status-badge{font-size:12px;font-weight:700;white-space:nowrap;}
.tested-badge{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;color:var(--header-blue-dark);
  background:#E4ECF9;border-radius:10px;padding:2px 8px;vertical-align:middle;}

.skeleton{background:linear-gradient(90deg,var(--empty-grey) 25%,#e6e6e6 50%,var(--empty-grey) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;height:60px;margin-bottom:10px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <h1>Tuition Content Tracker</h1>
    <div class="topbar-controls">
      <select id="student-select" class="student-select"></select>
      <select id="chapter-nav-select" class="student-select">
        <option value="">Jump to chapter…</option>
      </select>
      <span id="refreshed" class="refreshed"></span>
      <button id="auth-btn" class="auth-btn" onclick="onAuthBtnClick()">🔒 Atikah login</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="content"></div>
</div>

<div class="auth-modal-backdrop" id="auth-modal-backdrop" onclick="closeAuthModalIfBackdrop(event)">
  <div class="auth-modal">
    <h2>Atikah login</h2>
    <div class="auth-error" id="auth-error"></div>
    <input id="auth-pw-input" type="password" placeholder="Password" autocomplete="current-password">
    <div class="auth-modal-actions">
      <button class="auth-btn-cancel" onclick="closeAuthModal()">Cancel</button>
      <button class="auth-btn-submit" id="auth-submit-btn" onclick="submitPassword()">Unlock</button>
    </div>
  </div>
</div>

<script>
// ── Config: add a new student's { name, sheetId } here ──────────────────────
const STUDENTS = [
  { name: "Dani P5", sheetId: "1KPBumRLuHjqqvEaUBowK98j2N7N93GylCgmhu73iLtE" },
  { name: "Dani P4", sheetId: "1EjdhQ9u6R67OcNi6gf74xxDii6NLkkpETwih4i-j6Dg" },
  { name: "Dani P3", sheetId: "1nGyz5yEMrltdBjW4fFTZWNq0msgPGXx1oNgzPPO6Epw" },
];

const TAB_NAME = "Content Tracker";
const REFRESH_INTERVAL_MS = 60000;
const LAST_STUDENT_KEY = "tracker.lastStudentSheetId";

// ── Auth config: set APPS_SCRIPT_URL after deploying apps-script.gs ─────────
const AUTH_CFG = {
  scriptUrl: "https://script.google.com/macros/s/AKfycbyus3-_0OZF4b7vtyXUL9lnHCCRYb8y6JUG6-YLwZsBNDeFtCeT7Y5sU2J8NyZmGsTh/exec",
  tokenKey: "tracker.authToken",
};

// ── Pure logic functions (mirrored in tests/test_logic.js — keep in sync) ──

// Parses a gviz CSV response into an array of arrays of strings.
// (The gviz JSON endpoint infers a type per column from the data and then fails
// to coerce the header row's own text into that type — e.g. "Progress (0-3)"
// gets nulled out because that column is inferred as numeric. CSV sidesteps
// that entirely: every cell comes back as plain text.)
function parseCsv(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field); field = "";
    } else if (c === "\r") {
      // ignore, paired \n below ends the row
    } else if (c === "\n") {
      row.push(field); field = "";
      rows.push(row); row = [];
    } else {
      field += c;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

// Column positions in the Content Tracker tab (per §6 of the build-plan doc).
// CSV export collapses every merged banner/title row above the real header
// into a single row 0 (and garbles that row's own text in the process), so
// rows are read by fixed position rather than by header name.
const COLUMNS = { CHAPTER: 0, SUB_CONCEPT: 1, PROGRESS: 2, DATE_TAUGHT: 7, NOTES: 8, TESTED: 9 };

function mapCsvRows(rows) {
  const dataRows = rows.slice(1).filter(function (row) { return row && row[COLUMNS.CHAPTER]; });
  if (dataRows.length === 0) {
    throw new Error("No data rows found — check the Content Tracker tab layout");
  }
  return dataRows.map(function (row) {
    return {
      "Chapter": row[COLUMNS.CHAPTER] || "",
      "Sub-Concept": row[COLUMNS.SUB_CONCEPT] || "",
      "Progress (0-3)": row[COLUMNS.PROGRESS] || "",
      "Date Taught": row[COLUMNS.DATE_TAUGHT] || "",
      "Notes": row[COLUMNS.NOTES] || "",
      "Tested for Assessment?": row[COLUMNS.TESTED] || "",
    };
  });
}

function clampProgress(value) {
  const p = Number(value);
  return Number.isFinite(p) ? Math.max(0, Math.min(3, Math.round(p))) : 0;
}

const STATUS_BY_PROGRESS = {
  0: { label: "Not Started", color: "var(--status-red)" },
  1: { label: "Started", color: "var(--status-inprogress)" },
  2: { label: "Halfway", color: "var(--status-inprogress)" },
  3: { label: "Completed", color: "var(--status-green)" },
};

function deriveRowState(progress) {
  const clamped = clampProgress(progress);
  const status = STATUS_BY_PROGRESS[clamped];
  return {
    unit1Filled: clamped >= 1,
    unit2Filled: clamped >= 2,
    unit3Filled: clamped >= 3,
    statusLabel: status.label,
    statusColor: status.color,
  };
}

function isTested(row) {
  return String(row["Tested for Assessment?"] || "").trim().toLowerCase() === "yes";
}

function summarize(rows) {
  const subConceptCount = rows.length;
  const totalUnits = subConceptCount * 3;
  const unitsAchieved = rows.reduce(function (sum, r) { return sum + clampProgress(r["Progress (0-3)"]); }, 0);
  const pctAll = totalUnits === 0 ? 0 : unitsAchieved / totalUnits;

  const testedRows = rows.filter(isTested);
  const testedUnits = testedRows.length * 3;
  const testedAchieved = testedRows.reduce(function (sum, r) { return sum + clampProgress(r["Progress (0-3)"]); }, 0);
  const pctAssessment = testedUnits === 0 ? null : testedAchieved / testedUnits;

  return { subConceptCount, totalUnits, unitsAchieved, pctAll, testedUnits, testedAchieved, pctAssessment };
}

function computeChapterSummary(rows) {
  const chapters = [];
  const byChapter = new Map();
  rows.forEach(function (row) {
    const chapter = row["Chapter"];
    if (!chapter) return;
    if (!byChapter.has(chapter)) {
      byChapter.set(chapter, []);
      chapters.push(chapter);
    }
    byChapter.get(chapter).push(row);
  });

  return chapters.map(function (chapter) {
    const chapterRows = byChapter.get(chapter);
    return Object.assign({ chapter: chapter }, summarize(chapterRows));
  });
}

function computeOverallSummary(rows) {
  return summarize(rows);
}

async function fetchSheetAsCsv(sheetId, tabName) {
  const url = "https://docs.google.com/spreadsheets/d/" + sheetId +
    "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(tabName);
  const res = await fetch(url);
  if (!res.ok) throw new Error("Sheet fetch failed (HTTP " + res.status + ")");
  const text = await res.text();
  return parseCsv(text);
}

// ── Rendering ────────────────────────────────────────────────────────────────

function esc(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function escAttr(str) {
  return esc(str).replace(/"/g, "&quot;");
}

// ── Worksheet registry & mapping (backlog #6) ───────────────────────────────
// Paths are relative to index.html, synced via sync_worksheets.sh from the
// worksheet generator project (../worksheets/). Answer keys are intentionally
// excluded — worksheet-only downloads.
const WORKSHEET_FILES = {
  ws1_addition_of_decimals: { title: "Worksheet 1: Addition of Decimals", sets: { A: "worksheets/decimals/WS1_Addition_of_Decimals.pdf" } },
  ws2_place_value_of_decimals: { title: "Worksheet 2: Place Value of Decimals", sets: { A: "worksheets/decimals/WS2_Place_Value_of_Decimals.pdf", B: "worksheets/decimals/WS2_SetB_Place_Value_of_Decimals.pdf" } },
  ws3_fraction_to_decimal_i: { title: "Worksheet 3: Fraction to Decimal I", sets: { A: "worksheets/decimals/WS3_Fraction_to_Decimal_I.pdf" } },
  ws4_fraction_to_decimal_ii: { title: "Worksheet 4: Fraction to Decimal II", sets: { A: "worksheets/decimals/WS4_Fraction_to_Decimal_II.pdf", B: "worksheets/decimals/WS4_SetB_Fraction_to_Decimal_II.pdf", C: "worksheets/decimals/WS4_SetC_Fraction_to_Decimal_II.pdf" } },
  ws5_reading_number_line: { title: "Worksheet 5: Reading Number Line (in Decimal)", sets: { A: "worksheets/decimals/WS5_Reading_Number_Line_in_Decimal.pdf", B: "worksheets/decimals/WS5_SetB_Reading_Number_Line_in_Decimal.pdf", C: "worksheets/decimals/WS5_SetC_Reading_Number_Line_in_Decimal.pdf" } },
  ws6_reading_number_line_ii: { title: "Worksheet 6: Reading Number Line (in Decimal) II", sets: { A: "worksheets/decimals/WS6_Reading_Number_Line_in_Decimal_II.pdf", B: "worksheets/decimals/WS6_SetB_Reading_Number_Line_in_Decimal_II.pdf", C: "worksheets/decimals/WS6_SetC_Reading_Number_Line_in_Decimal_II.pdf" } },
  ws7_multiplying_by_powers_of_10_i: { title: "Worksheet 7: Multiplying Decimals (by 10, 100 and 1000) I", sets: { A: "worksheets/decimals/WS7_Multiplying_Decimals_by_10_100_1000_I.pdf", B: "worksheets/decimals/WS7_SetB_Multiplying_Decimals_by_10_100_1000_I.pdf" } },
  ws8_comparing_decimals: { title: "Worksheet 8: Comparing Decimals", sets: { A: "worksheets/decimals/WS8_Comparing_Decimals.pdf" } },
  ws9_ordering_decimals: { title: "Worksheet 9: Ordering Decimals", sets: { A: "worksheets/decimals/WS9_Ordering_Decimals.pdf" } },
  ws10_multiplication_of_decimals: { title: "Worksheet 10: Multiplication of Decimals", sets: { A: "worksheets/decimals/WS10_Multiplication_of_Decimals.pdf" } },
  ws11_division_of_decimals: { title: "Worksheet 11: Division of Decimals", sets: { A: "worksheets/decimals/WS11_Division_of_Decimals.pdf" } },
  numops_ws1_multiples_i: { title: "NumOps Worksheet 1: Multiples (2 to 10) I", sets: { A: "worksheets/number_operations/NumOps_WS1_Multiples_2_to_10_I.pdf" } },
  numops_ws2_multiples_ii: { title: "NumOps Worksheet 2: Multiples (2 to 10) II", sets: { A: "worksheets/number_operations/NumOps_WS2_Multiples_2_to_10_II.pdf" } },
  numops_ws3_multiples_iii: { title: "NumOps Worksheet 3: Multiples (2 to 10) III", sets: { A: "worksheets/number_operations/NumOps_WS3_Multiples_2_to_10_III.pdf" } },
  numops_ws4_division_mental: { title: "NumOps Worksheet 4: Division", sets: { A: "worksheets/number_operations/NumOps_WS4_Division.pdf" } },
  numops_ws5_long_division_i: { title: "NumOps Worksheet 5: Long Division I", sets: { A: "worksheets/number_operations/NumOps_WS5_Long_Division_I.pdf", B: "worksheets/number_operations/NumOps_WS5_SetB_Long_Division_I.pdf" } },
  numops_ws6_long_division_ii: { title: "NumOps Worksheet 6: Long Division II", sets: { A: "worksheets/number_operations/NumOps_WS6_Long_Division_II.pdf", B: "worksheets/number_operations/NumOps_WS6_SetB_Long_Division_II.pdf" } },
  rate_ws1_finding_and_using_rate: { title: "Rate Worksheet 1: Finding and Using Rate", sets: { A: "worksheets/rate/WS1_Finding_and_Using_Rate.pdf" } },
  rate_ws2_postage_rate_tables: { title: "Rate Worksheet 2: Postage Rate Tables", sets: { A: "worksheets/rate/WS2_Postage_Rate_Tables.pdf" } },
};

// Sub-concept-level matches: exact (Chapter, Sub-Concept) text as it appears in
// a sheet -> worksheet type ids. Matching is topic-based, not sheet-scoped — the
// same worksheet applies wherever that exact chapter+sub-concept text appears,
// regardless of which student/level sheet it's found in.
const WORKSHEET_MAP = [
  { chapter: "Chapter 3: Fraction and Division", subConcept: "Expressing fractions as decimals", worksheetIds: ["ws3_fraction_to_decimal_i", "ws4_fraction_to_decimal_ii"] },
  { chapter: "Chapter 7: Decimals", subConcept: "Multiplying and dividing decimals by 10, 100 and 1000", worksheetIds: ["ws7_multiplying_by_powers_of_10_i"] },
  { chapter: "Chapter 8: Rate", subConcept: "Finding simple rate", worksheetIds: ["rate_ws1_finding_and_using_rate", "rate_ws2_postage_rate_tables"] },
  { chapter: "Chapter 8: Rate", subConcept: "Finding metre rate", worksheetIds: ["rate_ws1_finding_and_using_rate", "rate_ws2_postage_rate_tables"] },
  { chapter: "Chapter 2: Factors and Multiples", subConcept: "Multiples and common multiples", worksheetIds: ["numops_ws1_multiples_i", "numops_ws2_multiples_ii", "numops_ws3_multiples_iii"] },
  { chapter: "Chapter 9: Decimals", subConcept: "Place values - tenths, hundredths and thousandths", worksheetIds: ["ws2_place_value_of_decimals"] },
  { chapter: "Chapter 9: Decimals", subConcept: "Comparing and ordering decimals", worksheetIds: ["ws8_comparing_decimals", "ws9_ordering_decimals"] },
  { chapter: "Chapter 9: Decimals", subConcept: "Expressing fraction as decimal", worksheetIds: ["ws3_fraction_to_decimal_i", "ws4_fraction_to_decimal_ii"] },
  { chapter: "Chapter 10: Four Operations of Decimals", subConcept: "Adding decimals", worksheetIds: ["ws1_addition_of_decimals"] },
  { chapter: "Chapter 10: Four Operations of Decimals", subConcept: "Multiplying decimals by 1-digit", worksheetIds: ["ws10_multiplication_of_decimals"] },
  { chapter: "Chapter 10: Four Operations of Decimals", subConcept: "Dividing decimals by 1-digit", worksheetIds: ["ws11_division_of_decimals"] },
  { chapter: "Chapter 4: Multiplication of 6, 7, 8, and 9", subConcept: "Multiplying and dividing within multiplication table", worksheetIds: ["numops_ws4_division_mental"] },
  { chapter: "Chapter 5: Multiplication and Division", subConcept: "Dividing 3-digit by 1-digit with no remainder", worksheetIds: ["numops_ws5_long_division_i"] },
  { chapter: "Chapter 5: Multiplication and Division", subConcept: "Dividing 3-digit by 1-digit with remainder", worksheetIds: ["numops_ws6_long_division_ii"] },
];

// Chapter-level matches for worksheets with no exact sub-concept match (general
// topic practice, e.g. decimal number-line reading).
const CHAPTER_WORKSHEET_MAP = [
  { chapter: "Chapter 7: Decimals", worksheetIds: ["ws5_reading_number_line", "ws6_reading_number_line_ii"] },
  { chapter: "Chapter 9: Decimals", worksheetIds: ["ws5_reading_number_line", "ws6_reading_number_line_ii"] },
];

function expandWorksheetIds(worksheetIds) {
  const out = [];
  worksheetIds.forEach(function (id) {
    const entry = WORKSHEET_FILES[id];
    if (!entry) return;
    const setLabels = Object.keys(entry.sets);
    setLabels.forEach(function (setLabel) {
      out.push({
        title: entry.title,
        setLabel: setLabels.length > 1 ? setLabel : null,
        path: entry.sets[setLabel],
      });
    });
  });
  return out;
}

function findWorksheetsForSubConcept(chapter, subConcept) {
  const c = String(chapter || "").trim();
  const s = String(subConcept || "").trim();
  const match = WORKSHEET_MAP.find(function (m) { return m.chapter === c && m.subConcept === s; });
  return match ? expandWorksheetIds(match.worksheetIds) : [];
}

function findWorksheetsForChapter(chapter) {
  const c = String(chapter || "").trim();
  const match = CHAPTER_WORKSHEET_MAP.find(function (m) { return m.chapter === c; });
  return match ? expandWorksheetIds(match.worksheetIds) : [];
}

function pctText(pct) {
  return pct === null ? "N/A" : (pct * 100).toFixed(1) + "%";
}

function renderBar(pct) {
  if (pct === null) return '<div class="bar-na">N/A — no assessed sub-concepts</div>';
  const width = Math.max(0, Math.min(100, pct * 100));
  return '<div class="bar-track"><div class="bar-fill' + (width >= 100 ? " full" : "") +
    '" style="width:' + width + '%"></div></div>';
}

function renderOverallSummary(rows) {
  const s = computeOverallSummary(rows);
  return (
    '<div class="card">' +
      "<h2>Overall Progress</h2>" +
      '<div class="overall-grid">' +
        '<div><div class="stat-label">% Complete (All) — ' + s.unitsAchieved + " / " + s.totalUnits + ' units</div>' +
          '<div class="stat-value">' + pctText(s.pctAll) + "</div>" + renderBar(s.pctAll) + "</div>" +
        '<div><div class="stat-label">% Complete (Assessment) — ' + s.testedAchieved + " / " + s.testedUnits + ' units</div>' +
          '<div class="stat-value">' + pctText(s.pctAssessment) + "</div>" + renderBar(s.pctAssessment) + "</div>" +
      "</div>" +
    "</div>"
  );
}

function renderWorksheetLinks(list) {
  if (!list || list.length === 0) return "";
  const links = list.map(function (w) {
    const label = esc(w.title) + (w.setLabel ? " — Set " + esc(w.setLabel) : "");
    return '<a class="worksheet-link" href="' + escAttr(w.path) + '" target="_blank" rel="noopener">' + label + "</a>";
  }).join("");
  return '<div class="subrow-worksheets">📄 ' + links + "</div>";
}

function renderChapterCard(summary, chapterRows) {
  const isOpen = openChapters.has(summary.chapter);
  const subRows = chapterRows.map(renderSubConceptRow).join("");
  const chapterWorksheets = renderWorksheetLinks(findWorksheetsForChapter(summary.chapter));
  return (
    '<div class="card chapter-card" data-chapter="' + escAttr(summary.chapter) + '">' +
      '<div class="chapter-header" aria-expanded="' + isOpen + '">' +
        '<div class="chapter-header-top">' +
          '<span class="chapter-toggle-icon">' + (isOpen ? "▾" : "▸") + "</span>" +
          '<span class="chapter-title">' + esc(summary.chapter) + "</span>" +
        "</div>" +
        '<div class="chapter-meta">' + summary.subConceptCount + " sub-concept" + (summary.subConceptCount === 1 ? "" : "s") + "</div>" +
        '<div class="bar-row"><div class="bar-row-label"><span>% Complete (All)</span><span>' + pctText(summary.pctAll) + "</span></div>" + renderBar(summary.pctAll) + "</div>" +
        '<div class="bar-row"><div class="bar-row-label"><span>% Complete (Assessment)</span><span>' + pctText(summary.pctAssessment) + "</span></div>" + renderBar(summary.pctAssessment) + "</div>" +
      "</div>" +
      '<div class="chapter-body"' + (isOpen ? "" : " hidden") + ">" +
        (chapterWorksheets ? '<div class="chapter-worksheets">' + chapterWorksheets + "</div>" : "") +
        '<div class="subconcepts">' + subRows + "</div>" +
      "</div>" +
    "</div>"
  );
}

function renderSubConceptRow(row) {
  const state = deriveRowState(row["Progress (0-3)"]);
  const tested = isTested(row)
    ? '<span class="tested-badge">TESTED</span>'
    : "";
  const worksheetLinks = renderWorksheetLinks(findWorksheetsForSubConcept(row["Chapter"], row["Sub-Concept"]));
  return (
    '<div class="subrow">' +
      '<div class="subrow-main">' +
        '<div class="subrow-name">' + esc(row["Sub-Concept"]) + tested + "</div>" +
        (row["Date Taught"] ? '<div class="subrow-date">Taught: ' + esc(row["Date Taught"]) + "</div>" : "") +
        (row["Notes"] ? '<div class="subrow-notes">' + esc(row["Notes"]) + "</div>" : "") +
        worksheetLinks +
      "</div>" +
      '<div class="units">' +
        '<div class="unit-block' + (state.unit1Filled ? " filled" : "") + '"></div>' +
        '<div class="unit-block' + (state.unit2Filled ? " filled" : "") + '"></div>' +
        '<div class="unit-block' + (state.unit3Filled ? " filled" : "") + '"></div>' +
      "</div>" +
      '<div class="status-badge" style="color:' + state.statusColor + '">' + state.statusLabel + "</div>" +
    "</div>"
  );
}

function renderPage(rows) {
  const chapterSummaries = computeChapterSummary(rows);
  const chapterCards = chapterSummaries.map(function (summary) {
    const chapterRows = rows.filter(function (r) { return r["Chapter"] === summary.chapter; });
    return renderChapterCard(summary, chapterRows);
  }).join("");

  return (
    renderOverallSummary(rows) +
    '<div class="card"><h2>Chapters</h2><div class="chapters-list">' + chapterCards + "</div></div>"
  );
}

function renderSkeleton() {
  return (
    '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>'
  );
}

function renderError(message) {
  return '<div class="state-message error">Couldn’t load this student’s tracker: ' + esc(message) + "</div>";
}

// ── Auth (password gates write features only — viewing stays public) ───────

async function sha256(msg) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(function (b) {
    return b.toString(16).padStart(2, "0");
  }).join("");
}

function isAuthed() {
  return !!localStorage.getItem(AUTH_CFG.tokenKey);
}

function updateAuthButton() {
  const btn = document.getElementById("auth-btn");
  if (isAuthed()) {
    btn.textContent = "🔓 Atikah (logged in)";
    btn.classList.add("unlocked");
  } else {
    btn.textContent = "🔒 Atikah login";
    btn.classList.remove("unlocked");
  }
}

function onAuthBtnClick() {
  if (isAuthed()) {
    if (confirm("Log out?")) {
      localStorage.removeItem(AUTH_CFG.tokenKey);
      updateAuthButton();
    }
  } else {
    openAuthModal();
  }
}

function openAuthModal() {
  document.getElementById("auth-error").textContent = "";
  document.getElementById("auth-pw-input").value = "";
  document.getElementById("auth-modal-backdrop").classList.add("open");
  document.getElementById("auth-pw-input").focus();
}

function closeAuthModal() {
  document.getElementById("auth-modal-backdrop").classList.remove("open");
}

function closeAuthModalIfBackdrop(event) {
  if (event.target.id === "auth-modal-backdrop") closeAuthModal();
}

async function submitPassword() {
  const pw = document.getElementById("auth-pw-input").value;
  const btn = document.getElementById("auth-submit-btn");
  const err = document.getElementById("auth-error");
  if (!pw) return;
  btn.textContent = "…";
  btn.disabled = true;
  err.textContent = "";
  try {
    const token = await sha256(pw);
    const url = AUTH_CFG.scriptUrl + "?action=auth&token=" + encodeURIComponent(token);
    const res = await fetch(url);
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem(AUTH_CFG.tokenKey, token);
      updateAuthButton();
      closeAuthModal();
    } else {
      err.textContent = "Wrong password. Try again.";
    }
  } catch (e) {
    err.textContent = "Could not reach server. Check connection.";
  }
  btn.textContent = "Unlock";
  btn.disabled = false;
}

document.getElementById("auth-pw-input").addEventListener("keydown", function (e) {
  if (e.key === "Enter") submitPassword();
});

// ── Wiring ────────────────────────────────────────────────────────────────────

const contentEl = document.getElementById("content");
const selectEl = document.getElementById("student-select");
const chapterNavEl = document.getElementById("chapter-nav-select");
const refreshedEl = document.getElementById("refreshed");
let currentStudent = null;
let refreshTimer = null;
const openChapters = new Set();

// ── Chapter accordion + quick-nav ───────────────────────────────────────────

function findChapterCard(chapterName) {
  return Array.from(contentEl.querySelectorAll(".chapter-card")).find(function (el) {
    return el.dataset.chapter === chapterName;
  });
}

function applyChapterOpenState(chapterName) {
  const card = findChapterCard(chapterName);
  if (!card) return;
  const isOpen = openChapters.has(chapterName);
  card.querySelector(".chapter-body").hidden = !isOpen;
  card.querySelector(".chapter-header").setAttribute("aria-expanded", String(isOpen));
  card.querySelector(".chapter-toggle-icon").textContent = isOpen ? "▾" : "▸";
}

function toggleChapter(chapterName) {
  if (openChapters.has(chapterName)) openChapters.delete(chapterName);
  else openChapters.add(chapterName);
  applyChapterOpenState(chapterName);
}

function openChapterAndScroll(chapterName) {
  if (!openChapters.has(chapterName)) {
    openChapters.add(chapterName);
    applyChapterOpenState(chapterName);
  }
  const card = findChapterCard(chapterName);
  if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
}

function populateChapterNav(chapterSummaries) {
  chapterNavEl.innerHTML = '<option value="">Jump to chapter…</option>' +
    chapterSummaries.map(function (s) {
      return '<option value="' + escAttr(s.chapter) + '">' + esc(s.chapter) + "</option>";
    }).join("");
}

contentEl.addEventListener("click", function (e) {
  const header = e.target.closest(".chapter-header");
  if (!header) return;
  const card = header.closest(".chapter-card");
  if (card) toggleChapter(card.dataset.chapter);
});

chapterNavEl.addEventListener("change", function (e) {
  const chapter = e.target.value;
  if (!chapter) return;
  openChapterAndScroll(chapter);
  e.target.value = "";
});

function populateStudentSelect() {
  selectEl.innerHTML = STUDENTS.map(function (s) {
    return '<option value="' + esc(s.sheetId) + '">' + esc(s.name) + "</option>";
  }).join("");

  const savedSheetId = localStorage.getItem(LAST_STUDENT_KEY);
  const match = STUDENTS.find(function (s) { return s.sheetId === savedSheetId; });
  selectEl.value = (match || STUDENTS[0]).sheetId;
}

async function loadStudent(sheetId) {
  const student = STUDENTS.find(function (s) { return s.sheetId === sheetId; }) || STUDENTS[0];
  const isStudentSwitch = !currentStudent || currentStudent.sheetId !== student.sheetId;
  if (isStudentSwitch) openChapters.clear();
  currentStudent = student;
  localStorage.setItem(LAST_STUDENT_KEY, student.sheetId);
  contentEl.innerHTML = renderSkeleton();

  try {
    const rows = await fetchSheetAsCsv(student.sheetId, TAB_NAME);
    const mapped = mapCsvRows(rows);
    contentEl.innerHTML = renderPage(mapped);
    populateChapterNav(computeChapterSummary(mapped));
    refreshedEl.textContent = "Data refreshed at " + new Date().toLocaleTimeString();
  } catch (err) {
    contentEl.innerHTML = renderError(student.name + ": " + err.message);
    refreshedEl.textContent = "Last refresh failed at " + new Date().toLocaleTimeString();
  }
}

function scheduleRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(function () {
    if (currentStudent) loadStudent(currentStudent.sheetId);
  }, REFRESH_INTERVAL_MS);
}

selectEl.addEventListener("change", function () {
  loadStudent(selectEl.value);
});

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && currentStudent) {
    loadStudent(currentStudent.sheetId);
  }
});

populateStudentSelect();
loadStudent(selectEl.value);
scheduleRefresh();
updateAuthButton();
</script>
